<body data-tool="social-counter">
<main class="s3-main">
  <section class="s3-hero">
    <h1>Social Counter</h1>
    <p>Write once and see how it fits everywhere: X's weighted count, Instagram's hashtag cap, YouTube and Google snippet lengths, and how many SMS parts it will cost. Emoji count the way each platform counts them.</p>
  </section>

  <div class="sc-grid">
    <section class="card stack">
      <div class="row between">
        <h2>Your text</h2>
        <div class="row">
          <button class="btn ghost small" type="button" id="sample">Sample</button>
          <button class="btn ghost small" type="button" id="copy"><svg class="i"><use href="#i-copy"/></svg>Copy</button>
          <button class="btn ghost small" type="button" id="clear"><svg class="i"><use href="#i-trash"/></svg>Clear</button>
        </div>
      </div>
      <label for="input" class="sr">Text</label>
      <textarea class="textarea prose sc-input" id="input" dir="auto" placeholder="Type or paste your post, caption or message…"></textarea>
      <div class="stats sc-stats" id="stats" aria-live="polite"></div>

      <div class="sc-sms" id="sms">
        <div class="row between">
          <h2>SMS</h2>
          <span class="chip" id="enc">GSM-7</span>
        </div>
        <div class="sc-parts" id="parts"></div>
        <p class="faint" id="smsNote"></p>
        <div id="nongsm" class="sc-nongsm" hidden></div>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>Limits</h2>
        <span class="faint">bar turns amber at 90%</span>
      </div>
      <ul class="sc-meters" id="meters"></ul>
    </section>
  </div>
</main>
<script src="app.js"></script>
</body>
